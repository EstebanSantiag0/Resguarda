<!DOCTYPE html>
<html lang="es-MX">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Orientación privada si vives violencia digital.">
  <meta name="theme-color" content="#23306B">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Resguarda">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Resguarda</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Pantalla de arranque: se ve desde el primer instante, mientras carga Flutter. */
    html, body { margin: 0; height: 100%; background: #23306B; }
    #arranque { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #arranque img { width: 128px; height: 128px; animation: latido 1.6s ease-in-out infinite; }
    @keyframes latido { 50% { transform: scale(1.04); } }
    @media (prefers-reduced-motion: reduce) { #arranque img { animation: none; } }
  </style>
</head>
<body>
  <div id="arranque"><img src="icons/Icon-192.png" alt="Resguarda"></div>
  <script>
    // Se quita en cuanto Flutter dibuja su primer cuadro.
    window.addEventListener('flutter-first-frame', () => document.getElementById('arranque')?.remove());
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
