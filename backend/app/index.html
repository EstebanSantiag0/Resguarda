<!doctype html>
<html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resguarda</title><style>body{margin:auto;max-width:760px;padding:24px;font:16px system-ui;background:#fff8f7;color:#281514}textarea,input,button{width:100%;box-sizing:border-box;padding:12px;margin:8px 0;font:inherit}button{background:#6e2548;color:white;border:0;border-radius:6px;font-weight:700;cursor:pointer}.danger{background:#792521}pre{white-space:pre-wrap;background:white;padding:16px;border-radius:6px}small{color:#604d4d}</style></head><body><h1>🛡️ Resguarda</h1><p>Orientación privada con IA local. No reemplaza atención de emergencia ni asesoría legal.</p><textarea id="story" rows="7" placeholder="Describe solo lo necesario; evita nombres, contraseñas y datos personales."></textarea><button onclick="ask()">Buscar orientación local</button><pre id="answer">La información se procesa en esta computadora.</pre><hr><h2>Evidencia</h2><input id="file" type="file" accept="image/*,.pdf"><button onclick="upload()">Guardar y calcular SHA-256</button><pre id="evidence"></pre><button onclick="report()">Descargar expediente PDF</button><button class="danger" onclick="eraseAll()">Borrar todo de este dispositivo</button><p><small>Salida rápida: cierra esta pestaña o usa Cmd/Ctrl+W.</small></p><script>async function ask(){const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','X-Resguarda':'1'},body:JSON.stringify({message:story.value})});const d=await r.json();answer.textContent=d.answer||d.detail; if(d.sources?.length)answer.textContent+='\n\nFuentes: '+d.sources.join(', ')}async function upload(){const f=file.files[0];if(!f)return;const form=new FormData();form.append('file',f);const r=await fetch('/api/evidence',{method:'POST',headers:{'X-Resguarda':'1'},body:form});const d=await r.json();evidence.textContent=d.sha256?'Guardada: '+d.filename+'\nSHA-256: '+d.sha256:d.detail}async function report(){const r=await fetch('/api/report',{method:'POST',headers:{'Content-Type':'application/json','X-Resguarda':'1'},body:JSON.stringify({summary:story.value})});const b=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='expediente-resguarda.pdf';a.click()}async function eraseAll(){if(confirm('¿Borrar evidencias y reportes locales?')){await fetch('/api/delete-all',{method:'POST',headers:{'X-Resguarda':'1'}});evidence.textContent='Datos locales borrados.';answer.textContent=''}};</script></body></html>
